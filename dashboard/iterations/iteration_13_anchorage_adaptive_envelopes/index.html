<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIS 停泊点识别看板</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <p class="eyebrow">AIS CLUSTERING</p>
        <h1>中国停泊点识别看板</h1>
        <p class="subtle">预测结果与真实数据空间对照</p>
      </div>
      <section class="stats" aria-label="统计概览">
        <article><span>预测泊位</span><strong id="predicted-berths">—</strong></article>
        <article><span>预测锚地</span><strong id="predicted-anchorages">—</strong></article>
        <article><span>预测码头</span><strong id="predicted-terminals">—</strong></article>
        <article><span>真实码头</span><strong id="reference-berths">—</strong></article>
        <article><span>真实锚地</span><strong id="reference-anchorages">—</strong></article>
      </section>
      <section class="legend">
        <h2>图层说明</h2>
        <p><i class="swatch berth"></i>预测泊位</p>
        <p><i class="swatch anchorage"></i>预测锚地</p>
        <p><i class="swatch terminal"></i>预测码头</p>
        <p><i class="swatch ref-berth"></i>真实码头</p>
        <p><i class="swatch ref-anchorage"></i>真实锚地</p>
      </section>
      <p class="hint">默认展示预测图层；可在地图右上角手动叠加真实数据。中国陆地与海岸线来自本地数据，不依赖网络底图。</p>
      <p class="timestamp" id="generated-at"></p>
    </aside>
    <main id="map" aria-label="中国 AIS 停泊点地图"></main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../../shared/base-6f96f4ef75ed.js"></script>
    <script src="data.js"></script>
    <script src="../../app.js"></script>
  </body>
</html>
